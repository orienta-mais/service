<html lang="pt-BR">
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<table style="max-width: 600px; margin: auto; background: #ffffff; border-radius: 8px; overflow: hidden;">
    <tr>
        <td style="background: #db7539; padding: 20px; text-align: center; color: white; font-size: 22px; font-weight: bold;">
            Complete o seu cadastro
        </td>
    </tr>
    <tr>
        <td style="padding: 20px; color: #333;">
            <p>Olá,</p>
            <p>Recebemos a sua solicitação para cadastro. Clique no botão abaixo para concluir:</p>
            <p style="text-align: center; margin: 30px 0;">
                <a href="${link}" style="background: #db7539; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-size: 16px;">

        </td>
    </tr>
</table>

</html>
