# Application
spring.application.name=orientamais

# Datasource / PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/orienta
spring.datasource.username=orienta_user
spring.datasource.password=orienta_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=orientamais.app@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true